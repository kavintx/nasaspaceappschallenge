[workspace]
resolver = "2"
exclude = ["web"]
members = [
    "crates/shared",
    "crates/db",
    "crates/ai-engine",
    "crates/ntrs",
    "crates/pipeline",
    "crates/rag",
    "crates/api",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
shared = { path = "crates/shared" }
db = { path = "crates/db" }
ai-engine = { path = "crates/ai-engine" }
ntrs = { path = "crates/ntrs" }
pipeline = { path = "crates/pipeline" }
rag = { path = "crates/rag" }
api = { path = "crates/api" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "json"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
subtle = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "rust_decimal", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset"] }
futures-util = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"
lopdf = "0.34"
clap = { version = "4", features = ["derive"] }
csv = "1"
bytes = "1"

[profile.dev]
debug = 1
