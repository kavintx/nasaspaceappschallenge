<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · Flame in Freefall</title>
  <meta name="description" content="Fire safety insights from decades of NASA microgravity combustion research.">
  <link rel="icon" href="/static/flame.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-ink-950 text-fg font-sans antialiased min-h-screen flex flex-col">
  <header class="bg-ink-900 border-b border-line/60">
    <nav class="mx-auto max-w-page px-6 lg:px-24 h-[52px] flex items-center gap-6">
      <a href="/" class="flex items-center gap-2.5 text-[14px] font-medium shrink-0">
        <img src="/static/flame.svg" alt="" class="w-5 h-5">Flame in Freefall
      </a>
      <div class="hidden md:flex flex-1 justify-center gap-7 text-[12px]">
        <a href="/" class="{% if active == "habitat" %}text-fg{% else %}text-muted hover:text-fg{% endif %}">Habitat Risk</a>
        <a href="/explorer" class="{% if active == "explorer" %}text-fg{% else %}text-muted hover:text-fg{% endif %}">Explorer</a>
        <a href="/compare" class="{% if active == "compare" %}text-fg{% else %}text-muted hover:text-fg{% endif %}">Compare</a>
        <a href="/papers" class="{% if active == "papers" %}text-fg{% else %}text-muted hover:text-fg{% endif %}">Literature</a>
        <a href="/ask" class="{% if active == "ask" %}text-fg{% else %}text-muted hover:text-fg{% endif %}">Ask the Data</a>
        <a href="/pipeline" class="{% if active == "pipeline" %}text-fg{% else %}text-muted hover:text-fg{% endif %}">Pipeline</a>
      </div>
      <form action="/explorer" method="get" class="ml-auto md:ml-0">
        <label class="flex items-center gap-2 bg-ink-800 rounded-md px-3 h-9 w-48 text-[13px] text-muted focus-within:ring-1 focus-within:ring-sky/60">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input name="q" placeholder="Search research" class="bg-transparent outline-none w-full text-fg placeholder:text-muted">
        </label>
      </form>
    </nav>
  </header>
  <div class="bg-ink-950 border-b border-line/60">
    <div class="mx-auto max-w-page px-6 lg:px-24 h-16 flex items-center justify-between">
      <h1 class="text-[19px] font-semibold tracking-tight">{{ page_title }}</h1>
      <p class="text-[12px] text-muted">{{ context_line }}</p>
    </div>
  </div>

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-ink-900 border-t border-line/60">
    <div class="mx-auto max-w-page px-6 lg:px-24 h-[84px] flex items-center justify-between text-[12px] text-muted">
      <span>Data: NASA PSI + NTRS</span>
      <span class="hidden sm:inline">Built for NASA Space Apps 2026</span>
      <span>Research preview · v0.1</span>
    </div>
  </footer>
  <script>
    // AI requests can take a while: show that something is happening.
    document.querySelectorAll("form[data-slow]").forEach(function (f) {
      f.addEventListener("submit", function () {
        var b = f.querySelector("button");
        if (b) { b.textContent = "Working… this can take a minute"; b.disabled = true; b.classList.add("opacity-60"); }
      });
    });
  </script>
</body>
</html>
