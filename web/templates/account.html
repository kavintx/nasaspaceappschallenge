{% extends "base.html" %}
{% block content %}
{% include "account_style.html" %}

<div class="ac-zone">
  <div class="ac-glow"></div>
  <div class="ac-col">
    <section class="ac-card">
      <div class="ac-profile">
        <div class="ac-avatar" aria-hidden="true">{{ initial }}</div>
        <div class="ac-who">
          <b>{{ name }}</b>
          <span class="ac-mail">{{ email }}</span>
        </div>
      </div>
      <p class="ac-note">Your account lives in the research database. Scanned items stay on this device until crew sync arrives.</p>
      <form method="post" action="/account/logout">
        <button type="submit" class="ac-out">Log out</button>
      </form>
    </section>
  </div>
</div>
{% endblock %}
